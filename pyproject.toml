[project]
name = "DataLint-ml"
version = "1.0.1"
readme = "README.md"
authors = [
    { name = "Maxime-Cllt" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.11.0",
    "scikit-learn>=1.8.0",
    "pandas>=3.0.2",
    "numpy>=2.4.4",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "transformers>=5.7.0",
    "datasets>=4.8.5",
    "torchinfo>=1.8.0",
    "sqlalchemy>=2.0.43",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.4.1",
    "black>=25.1.0",
    "ruff>=0.12.11"
]

# Configuration for Hatch build system
[tool.hatch.build]
include = [
    "datalint_ml/**.py",
    "README.md",
    "LICENSE",
]
exclude = [
    "tests/",
    "docs/",
    "*.ipynb",
    ".github/",
    ".vscode/",
    ".idea/",
]

# Configuration for pytest
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"